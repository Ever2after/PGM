[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgm-asc"
version = "1.0.0"
description = "Probabilistic graphical models for adaptive self-consistency: aggregation heads, baselines and replayable response banks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ever2after"}]
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "torch>=2.8,<3",
  "scikit-learn>=1.7,<2",
  "pyarrow>=17",
  "filelock>=3.16",
  "huggingface-hub>=0.30",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
collect = ["vllm==0.11.0", "transformers==4.56.2"]
test = ["pytest>=8"]

[project.scripts]
pgm = "pgm_asc.cli:main"

[project.urls]
Repository = "https://github.com/Ever2after/PGM"
Artifacts = "https://huggingface.co/datasets/Ever2after/PGM-artifacts"

[tool.setuptools.packages.find]
include = ["pgm_asc*"]

[tool.setuptools.package-data]
"pgm_asc.report" = ["report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
